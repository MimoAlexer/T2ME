name: Feature request
description: Suggest a focused improvement to T2ME.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the limitation or workflow this would improve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the command, configuration, or behavior you would like.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility considerations
      description: Note any effects on world data, server tick time, memory, or other mods.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
