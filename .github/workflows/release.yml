name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify, test, and build release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify tag matches mod version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          if [[ -z "$version" || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' must match mod_version as 'v$version'."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Test and build
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test build --stacktrace

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(
            find build/libs -maxdepth 1 -type f \
              -name 't2me-*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              -print
          )
          if [[ "${#jars[@]}" -ne 1 ]]; then
            printf 'Expected exactly one release JAR, found %s\n' "${#jars[@]}" >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          jar tf "${jars[0]}" | grep -qx 'META-INF/mods.toml'
          jar tf "${jars[0]}" | grep -qx 'META-INF/accesstransformer.cfg'
          jar tf "${jars[0]}" | grep -qx 't2me.mixins.json'
          jar tf "${jars[0]}" | grep -qx 't2me.refmap.json'
          jar tf "${jars[0]}" | grep -qx 'dev/t2me/T2ME.class'
          cp "${jars[0]}" dist/
          (
            cd dist
            sha256sum ./*.jar > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Upload release bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-bundle
          path: dist

      - name: Verify downloaded assets
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "T2ME $GITHUB_REF_NAME"
