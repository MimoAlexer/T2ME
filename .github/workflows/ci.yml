name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build on Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Test and build
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test build --stacktrace

      - name: Package checksummed JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(
            find build/libs -maxdepth 1 -type f \
              -name 't2me-*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              -print
          )
          if [[ "${#jars[@]}" -ne 1 ]]; then
            printf 'Expected exactly one release JAR, found %s\n' "${#jars[@]}" >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          jar tf "${jars[0]}" | grep -qx 'META-INF/mods.toml'
          jar tf "${jars[0]}" | grep -qx 'META-INF/accesstransformer.cfg'
          jar tf "${jars[0]}" | grep -qx 't2me.mixins.json'
          jar tf "${jars[0]}" | grep -qx 't2me.refmap.json'
          jar tf "${jars[0]}" | grep -qx 'dev/t2me/T2ME.class'
          cp "${jars[0]}" dist/
          (
            cd dist
            sha256sum ./*.jar > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          {
            echo '### Build checksum'
            echo '```text'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JAR and checksum
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: t2me-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
